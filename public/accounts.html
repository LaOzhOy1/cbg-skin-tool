<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>账号管理 · 藏宝阁监控</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="bg-canvas text-ink-100 antialiased">

<div class="flex min-h-screen">
  <!-- 左侧：账号列表 + 新建表单 -->
  <aside class="w-96 shrink-0 border-r border-line px-6 py-8 flex flex-col gap-6 overflow-y-auto">
    <div class="flex items-center gap-3">
      <div class="deco-mark"></div>
      <div>
        <p class="text-sm tracking-[0.2em] text-ink-400 uppercase">Accounts</p>
        <p class="text-base font-medium text-ink-100">账号管理</p>
      </div>
    </div>

    <p class="text-xs text-ink-500 leading-relaxed">
      同一时刻只有一个账号处于"活跃"状态——扫货任务、需求执行都优先绑定活跃账号。
      切换账号不会自动帮你登录/过验证码，验证码/风控挑战仍然需要你在弹出的浏览器窗口里手动完成。
    </p>

    <form id="create-form" class="flex flex-col gap-2">
      <label class="flex flex-col gap-1">
        <span class="text-xs text-ink-500">账号名称</span>
        <input id="field-name" class="admin-input" placeholder="例如：小号1" required />
      </label>
      <button type="submit" class="verify-btn">新建账号</button>
      <p id="create-error" class="text-xs text-accent-rose hidden"></p>
    </form>

    <div class="text-xs text-ink-500 uppercase tracking-wider">账号列表</div>
    <div id="account-list" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>

    <a href="/admin" class="text-xs text-ink-500 hover:text-ink-200">→ 需求管理</a>
    <a href="/sweep" class="text-xs text-ink-500 hover:text-ink-200">→ 扫货任务</a>
    <a href="/" class="text-xs text-ink-500 hover:text-ink-200">← 返回监控面板</a>
  </aside>

  <!-- 主体：账号详情 -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    <div id="empty-detail" class="flex-1 flex items-center justify-center text-ink-500 text-sm">
      选择左侧一个账号查看详情，或新建一个账号
    </div>

    <div id="detail" class="hidden flex-1 px-10 py-8 flex flex-col gap-6 max-w-2xl">
      <div>
        <div class="flex items-center gap-3">
          <h1 id="detail-name" class="text-lg font-medium text-ink-100"></h1>
          <span id="detail-active-badge" class="admin-badge ok hidden">活跃</span>
          <span id="detail-login-badge" class="admin-badge"></span>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="activate-btn" class="verify-btn" style="width:auto; padding: 0.5rem 1.2rem;">设为活跃账号</button>
        <button id="verify-btn" class="verify-btn" style="width:auto; padding: 0.5rem 1.2rem;">打开验证窗口</button>
        <button id="delete-btn" class="text-xs text-accent-rose hover:underline">删除账号</button>
      </div>
      <p id="verify-hint" class="text-xs text-ink-500 hidden"></p>

      <section>
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-sm text-ink-400 uppercase tracking-wider">账号信息</h2>
          <button id="refresh-profile-btn" class="text-xs text-accent-blue hover:underline">刷新账号信息</button>
        </div>
        <div id="profile-empty" class="text-xs text-ink-500">
          尚未拉取，点击"刷新账号信息"从藏宝阁查一次（只能对当前活跃账号操作）。
        </div>
        <div id="profile-detail" class="hidden text-sm text-ink-200 flex flex-col gap-1">
          <div>手机号：<span id="profile-phone"></span></div>
          <div>手机绑定状态：<span id="profile-mobile-bind"></span></div>
          <div class="text-xs text-ink-500 mt-1">
            通行证内部标识：<span id="profile-urs"></span>
            （网易系统生成的账号标识，不是你自己注册时填的邮箱）
          </div>
          <div class="text-xs text-ink-500">更新于：<span id="profile-updated-at"></span></div>
        </div>
        <p id="profile-error" class="text-xs text-accent-rose hidden"></p>
      </section>

      <section>
        <h2 class="text-sm text-ink-400 uppercase tracking-wider mb-2">买家角色（用于扫货下单）</h2>
        <form id="role-form" class="flex flex-col gap-2">
          <label class="flex flex-col gap-1">
            <span class="text-xs text-ink-500">角色 ID（roleid）</span>
            <input id="field-role-id" class="admin-input" placeholder="例如：apjc000023113400120163" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-xs text-ink-500">服务器 ID（buyer_serverid）</span>
            <input id="field-server-id" class="admin-input" placeholder="例如：2" />
          </label>
          <button type="submit" class="verify-btn" style="width:auto; padding: 0.5rem 1.2rem;">保存</button>
          <p id="role-saved-hint" class="text-xs text-accent-green hidden">已保存</p>
        </form>
      </section>
    </div>
  </main>
</div>

<script src="accounts.js"></script>
</body>
</html>
